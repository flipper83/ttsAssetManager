[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-asset-manager"
version = "0.1.0"
description = "Prepare Tabletop Simulator saves from local assets without opening TTS"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "ruff>=0.3",
    "PyQt6>=6.6",
]

[project.scripts]
tts-manager = "tts_manager.cli:main"
tts-manager-gui = "tts_manager.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
